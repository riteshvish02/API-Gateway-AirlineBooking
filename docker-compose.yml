version: "3.8"

services:
  api-gateway:
    build: .
    container_name: api-gateway
    ports:
      - "3001:3001"
    volumes:
      # Bind mount your source code from Windows
      - C:/Users/asus/Desktop/previousbackup/airlineBookingMicroservices/API-Gateway:/app

      # Keep Linux node_modules inside container (named volume)
      - node_modules:/app/node_modules

    # -/app/node_modules    it creates anonymous volume also prevents overwriting node_modules with the host's (which may be empty or incompatible)

    command: npm run dev
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

volumes:
  node_modules:
